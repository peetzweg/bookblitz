<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    In the spirit of Literal's mark: chunky monoline strokes with a slight hand-set tilt on paper.
    A lowercase b for bookblitz, a lightning bolt in Literal green (the one coloured thing, like the
    focus letter in the reader), and a slanted bar that doubles as the reader's guide line.
  -->
  <rect width="512" height="512" rx="112" fill="#f6f4ee"/>
  <g fill="none" stroke="#111" stroke-width="54" transform="rotate(-4 256 256)">
    <path d="M146 96 V344" stroke-linecap="butt"/>
    <circle cx="214" cy="279" r="65"/>
  </g>
  <path d="M378 92 L304 214 H354 L326 306 L420 170 H368 L398 92 Z" fill="#278459" transform="rotate(8 362 199)"/>
  <path d="M126 424 L384 394" stroke="#111" stroke-width="46" stroke-linecap="butt"/>
</svg>
